name: Time engine tests
on:
  push:
    branches: [main, refactor/time-engine-clean, refactor/unified-timeline-model]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-default-type=module time-engine.test.js
      - name: Check time rail UI integration
        run: node timeline-ui.test.js
      - name: Check quick-add parser
        run: node --experimental-default-type=module quick-add-parser.test.js
      - name: Check planner module syntax
        run: sed -n '/<script type="module">/,/<\/script>/p' index.html | sed '1d;$d' | node --input-type=module --check
      - name: Check service worker syntax
        run: node --check sw.js
      - name: Check PWA manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest', 'utf8'))"
      - name: Verify offline module precache
        run: |
          grep -Fq "'./time-engine.js?v=20261124-1'" sw.js
          grep -Fq "'./quick-add-parser.js?v=20261124-1'" sw.js
